name: Release SQL Optima Action

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build, Commit Dist & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build dist
        run: |
          npm ci
          npm run build

      - name: Commit and push compiled dist bundle
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add dist/
          if ! git diff-index --quiet HEAD; then
            git commit -m "build: update dist bundle for release ${{ github.ref_name }}"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes in dist/ to commit."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
