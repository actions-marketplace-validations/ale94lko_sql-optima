name: Bug report
description: Report a problem with SQL Optima Action
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Before you begin, **please ensure that there are no [existing issues](https://github.com/ale94lko/sql-optima/issues)**, whether still open or closed, related to your report.
        ---

  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      description: Which engine were you analyzing?
      options:
        - postgres
        - mysql
        - mariadb
        - other / unknown
    validations:
      required: true

  - type: input
    id: action-version
    attributes:
      label: Action version / ref
      description: e.g. v1, main, or a commit SHA
      placeholder: ale94lko/sql-optima@v1
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Include workflow YAML and a minimal SQL snippet when possible.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What do you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: |
        Logs, Step Summary screenshots, or links that give more context.

        Tip: You can attach images or log files by clicking this area and dragging files in.
    validations:
      required: false
